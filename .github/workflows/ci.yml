# Maintained in moderation-api/sdk-generator (custom/typescript). Edits here are overwritten.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Import the package (ESM and CommonJS)
        run: |
          node --input-type=module -e "import ModerationApi, { ModerationApi as Named } from '@moderation-api/sdk'; if (ModerationApi !== Named) process.exit(1);"
          node -e "const m = require('@moderation-api/sdk'); if (m.default !== m.ModerationApi) process.exit(1);"
