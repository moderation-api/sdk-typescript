# Maintained in moderation-api/sdk-generator (custom/typescript). Edits here are overwritten.
# Publishes with npm trusted publishing (OIDC), configured on npmjs.com for this workflow file.
name: Publish NPM
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public --provenance
